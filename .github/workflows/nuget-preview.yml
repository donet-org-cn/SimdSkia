name: NuGet release

on:
  push:
    tags: ['v*-preview.*', 'v0.1.0', 'v0.1.1']
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved release version'
        required: true
        default: '0.1.2-preview.2'
      publish:
        description: 'Publish verified packages to NuGet.org using trusted publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nuget-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate preview version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:REQUESTED_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(-preview\.\d+)?$') { throw 'Invalid stable/preview SemVer.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned licensed test fonts
        shell: pwsh
        run: |
          ./tools/fetch-test-font.ps1
          ./tools/fetch-avalonia-font.ps1
      - name: Verify managed rendering and fixed-font controls
        shell: pwsh
        run: |
          dotnet build SimdSkia.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/SimdSkia.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Optimization -c Release --no-build -- baseline/fonts/ZenOldMincho-Regular.ttf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Imaging -c Release --no-build -- --independent-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/CompatibilityExpansion/Managed -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Pdf -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PlatformFonts -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GlyphBatches -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/AvaloniaControls -c Release --no-build -- --frames 5 --output artifacts/nuget-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify final managed API behavior and retained native gaps
        shell: pwsh
        run: |
          foreach ($project in @('FinalRaster/Managed','AlphaCompatibility/Managed','FinalPaint/Managed','SkpDocuments/Validation','FloatPaintSimd')) {
            dotnet run --project "tests/$project" -c Release --no-build -- "artifacts/nuget-final-api/$project"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet run --project tools/ApiAudit -c Release --no-build -- extract src/SimdSkia.Compatibility/bin/Release/net10.0/SimdSkia.Compatibility.dll artifacts/nuget-final-api/implemented.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/ApiAudit -c Release --no-build -- compare docs/api/baseline-3.119.4.json artifacts/nuget-final-api/implemented.json artifacts/nuget-final-api/comparison.json
          if ($LASTEXITCODE -notin @(0,2)) { exit $LASTEXITCODE }
          python tools/check-final-api-baseline.py --comparison artifacts/nuget-final-api/comparison.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DOTNET_EnableAVX2 = '0'
          dotnet run --project tests/FloatPaintSimd -c Release --no-build -- artifacts/nuget-final-api/float-sse2
          exit $LASTEXITCODE
      - name: Record unchanged JPEG gate and enforce only disclosed preview exceptions
        run: python tools/check-jpeg-parity.py --output artifacts/jpeg-parity --check-documented-differences
      - name: Compare all SaveLayer blend modes and parent clip with the original
        run: python tools/check-layer-bounds.py --no-build --output artifacts/layer-bounds
      - name: Verify full codec integration
        run: dotnet run --project tests/CodecIntegration -c Release --no-build
      - name: Verify scalar codec fallback
        shell: pwsh
        run: |
          $env:DOTNET_EnableHWIntrinsic = '0'
          dotnet run --project tests/CodecIntegration -c Release --no-build
          exit $LASTEXITCODE
      - name: Pack preview packages and inspect dependency graph
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:PREVIEW_VERSION -match '-preview\.') {
            ./tools/pack-preview.ps1 -Version $env:PREVIEW_VERSION
          } else {
            ./tools/pack-release.ps1 -Version $env:PREVIEW_VERSION -Output artifacts/nuget-preview
          }
      - name: Consume actual codec packages (not source project references)
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/test-codec-package.ps1 -Version $env:PREVIEW_VERSION -Packages artifacts/nuget-preview
      - name: Consume the packages and verify a real Native AOT window
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/test-preview-consumer.ps1 -Version $env:PREVIEW_VERSION
      - name: Consume the actual desktop and GPU adapter packages
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/test-desktop-package.ps1 -Version $env:PREVIEW_VERSION -Packages artifacts/nuget-preview
      - name: Consume the optional PDF and compatibility packages
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/test-pdf-package.ps1 -Version $env:PREVIEW_VERSION -Packages artifacts/nuget-preview
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-preview-${{ steps.version.outputs.version }}
          path: |
            artifacts/nuget-preview/*.nupkg
            artifacts/nuget-preview/*.snupkg
            artifacts/nuget-preview/manifest.json
            artifacts/jpeg-parity/
            artifacts/codec-package-consumer/results/
            artifacts/nuget-consumer/metrics.json
            artifacts/nuget-consumer/window.png
            artifacts/desktop-package-consumer/results/
            artifacts/pdf-package-consumer/results/
            artifacts/nuget-final-api/**/*.json
            artifacts/layer-bounds/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-validation-logs
          path: |
            artifacts/nuget-consumer/*.log
            artifacts/jpeg-parity/
            artifacts/codec-package-consumer/*.log
            artifacts/desktop-package-consumer/*.log
            artifacts/pdf-package-consumer/*.log
            artifacts/nuget-final-api/**/*.json
            artifacts/layer-bounds/
          if-no-files-found: ignore

  avalonia-versions:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-preview-${{ needs.build.outputs.version }}
          path: artifacts/frozen-packages
      - name: Fetch licensed CJK fixture
        shell: pwsh
        run: ./tools/fetch-avalonia-font.ps1
      - name: Install Linux display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libxrandr2 libxi6 libxcursor1 libxinerama1 libxext6 libxrender1 libglib2.0-0
      - name: Locate frozen NuGet feed
        id: feed
        shell: pwsh
        run: |
          $feed=(Get-ChildItem artifacts/frozen-packages -Filter manifest.json -Recurse|Select-Object -First 1).Directory.FullName
          if(!$feed){throw 'Missing frozen package manifest.'}
          "path=$feed" >> $env:GITHUB_OUTPUT
      - name: Six-version real package matrix and minimum/latest Native AOT
        if: runner.os != 'Linux'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          FROZEN_FEED: ${{ steps.feed.outputs.path }}
        run: ./tools/test-avalonia-versions.ps1 -Version $env:RELEASE_VERSION -Packages $env:FROZEN_FEED -NativeAot
      - name: Linux six-version X11 and minimum/latest Native AOT
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          FROZEN_FEED: ${{ steps.feed.outputs.path }}
        run: xvfb-run -a -s '-screen 0 1280x900x24' pwsh -NoProfile -File tools/test-avalonia-versions.ps1 -Version "$RELEASE_VERSION" -Packages "$FROZEN_FEED" -NativeAot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-versions-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/avalonia-matrix/results/results.json
            artifacts/avalonia-matrix/results/*/*.log
            artifacts/avalonia-matrix/results/*/controls/*.json
            artifacts/avalonia-matrix/results/*/desktop/results/
            artifacts/avalonia-matrix/results/*/desktop/aot-results/
            artifacts/avalonia-matrix/results/*/desktop/*build.log
          if-no-files-found: warn

  publish:
    needs: [build, avalonia-versions]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-preview-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Require the configured NuGet profile
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"
      - name: Exchange GitHub OIDC for a short-lived NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish preview packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find artifacts -name '*.nupkg' -print0 | sort -z)
          if [ "${#packages[@]}" -ne 12 ]; then echo 'Expected exactly twelve packages'; exit 1; fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
      - name: Verify public NuGet downloads match the CI packages
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find artifacts -name manifest.json -print -quit)
          python3 tools/verify-published-preview.py --manifest "$manifest" --wait-seconds 1200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-public-verification-${{ needs.build.outputs.version }}
          path: artifacts/**/published-verification.json
          if-no-files-found: ignore
