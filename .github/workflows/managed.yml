name: Managed engine verification
on: [push, pull_request]
jobs:
  managed:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet build SimdSkia.sln -c Release
      - run: dotnet run --project tests/SimdSkia.Tests -c Release --no-build
      - run: dotnet run --project examples/Rectangle -c Release --no-build
      - name: Fetch licensed CJK fixture
        shell: pwsh
        run: ./tools/fetch-test-font.ps1
      - run: dotnet run --project tests/Features -c Release --no-build -- baseline/fonts/ZenOldMincho-Regular.ttf
      - run: dotnet run --project tests/Optimization -c Release --no-build -- baseline/fonts/ZenOldMincho-Regular.ttf
      - run: dotnet run --project tests/Avalonia -c Release --no-build -- baseline/fonts/ZenOldMincho-Regular.ttf
      - name: Fetch licensed Simplified Chinese UI fixture
        shell: pwsh
        run: ./tools/fetch-avalonia-font.ps1
      - run: dotnet run --project tests/AvaloniaControls -c Release --no-build -- --frames 5 --output artifacts/avalonia-controls/ci
      - run: dotnet run --project examples/AvaloniaControls -c Release --no-build
      - name: Verify real Win32 software presentation
        if: runner.os == 'Windows'
        run: dotnet run --project examples/AvaloniaControls -c Release --no-build -- --smoke-window
      - name: Check native dependency isolation
        shell: pwsh
        run: ./tools/check-production-dependencies.ps1
      - name: Verify scalar fallback
        shell: pwsh
        run: |
          $env:DOTNET_EnableHWIntrinsic = '0'
          dotnet tests/Optimization/bin/Release/net8.0/Optimization.dll baseline/fonts/ZenOldMincho-Regular.ttf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/Avalonia/bin/Release/net8.0/SimdSkia.Avalonia.Tests.dll baseline/fonts/ZenOldMincho-Regular.ttf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/AvaloniaControls/bin/Release/net8.0/SimdSkia.Avalonia.Controls.Tests.dll --frames 5 --output artifacts/avalonia-controls/ci-scalar
          exit $LASTEXITCODE
