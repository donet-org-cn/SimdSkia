name: Windows Native AOT smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  aot:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned OFL font
        shell: pwsh
        run: ./tools/fetch-avalonia-font.ps1
      - name: Publish both portable x64 backends (AOT diagnostics are errors)
        shell: pwsh
        run: |
          dotnet publish examples/AvaloniaAot/SimdSkia/AvaloniaAot.SimdSkia.csproj -c Release -o artifacts/aot-comparison/publish/simd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish examples/AvaloniaAot/Original/AvaloniaAot.Original.csproj -c Release -o artifacts/aot-comparison/publish/original
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual Win32 AOT controls and pixel probes
        shell: pwsh
        run: |
          foreach ($name in @('simd','original')) {
            $project = if ($name -eq 'simd') { 'SimdSkia' } else { 'Original' }
            $process = Start-Process -FilePath "artifacts/aot-comparison/publish/$name/AvaloniaAot.$project.exe" -ArgumentList "--hidden --output artifacts/aot-comparison/smoke-$name --warmup 0 --seconds 0.2" -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "artifacts/aot-comparison/smoke-$name.stdout.txt" -RedirectStandardError "artifacts/aot-comparison/smoke-$name.stderr.txt"
            if ($process.ExitCode -ne 0) { Get-Content "artifacts/aot-comparison/smoke-$name.stderr.txt"; exit $process.ExitCode }
            $metrics = Get-Content "artifacts/aot-comparison/smoke-$name/metrics.json" -Raw | ConvertFrom-Json
            if (!$metrics.nativeAot -or !$metrics.imageBrushProbePassed -or $metrics.frames -le 0) { throw "AOT runtime probe failed: $name" }
            if ($metrics.loadedModules -match '^(coreclr|clrjit|clr|mscorwks|mscorsvr)\.dll$') { throw "JIT runtime loaded: $name" }
          }
      - name: Verify precise sampling in portable and AVX2 Native AOT
        shell: pwsh
        run: |
          foreach ($variant in @('portable','v3')) {
            $instructionSet = if ($variant -eq 'v3') { 'x86-64-v3' } else { '' }
            dotnet publish tests/SamplingAot -c Release -r win-x64 -p:IlcInstructionSet=$instructionSet -o "artifacts/sampling-aot/$variant"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $output = & "artifacts/sampling-aot/$variant/SamplingAot.exe"
            if ($LASTEXITCODE -ne 0) { throw "AOT sampling failed: $variant" }
            $output | Set-Content "artifacts/sampling-aot/$variant.txt"
            $output | Write-Output
            $text = $output -join "`n"
            if ($text -notmatch 'NativeAot=True' -or $text -notmatch 'PASS 460050 sampling checks') { throw "Missing AOT sampling results: $variant" }
          }
      - name: Verify standalone compatibility and PDF reader in Native AOT
        shell: pwsh
        run: |
          dotnet publish tests/CompatibilityExpansion/Managed -c Release -r win-x64 -p:NativeAotTest=true -o artifacts/standalone-aot/compat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/standalone-aot/compat/Managed.exe artifacts/standalone-aot/compat-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/Pdf -c Release -r win-x64 -p:NativeAotTest=true -o artifacts/standalone-aot/pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/standalone-aot/pdf/Pdf.exe artifacts/standalone-aot/pdf-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/CodecIntegration -c Release -r win-x64 -p:NativeAotTest=true -o artifacts/codec-aot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/codec-aot/CodecIntegration.exe artifacts/codec-aot-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the published PDF viewer opens and draws its toolbar
        shell: pwsh
        run: |
          dotnet publish examples/PdfViewer -c Release -r win-x64 -p:PublishAot=true -p:OptimizationPreference=Size -o artifacts/pdf-viewer-aot/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publish = (Resolve-Path artifacts/pdf-viewer-aot/publish).Path
          $run = New-Item -ItemType Directory -Path artifacts/pdf-viewer-aot/run
          $process = Start-Process -FilePath "$publish/PdfViewer.exe" -WorkingDirectory $run.FullName -ArgumentList '--smoke' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(45000)) { $process.Kill(); throw "PDF viewer smoke timed out" }
          $results = Join-Path $run.FullName 'artifacts/pdf-viewer'
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$results/error.txt") { Get-Content "$results/error.txt" }
            throw "PDF viewer smoke exited with $($process.ExitCode)"
          }
          if ((Get-Content "$results/result.txt" -Raw) -notmatch 'PASS actual PDF window; page 1/2;') {
            throw "Missing successful PDF viewer smoke result"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-aot-smoke
          path: |
            artifacts/aot-comparison/smoke-*
            artifacts/sampling-aot/*.txt
            artifacts/standalone-aot/*-results/
            artifacts/codec-aot-results/
            artifacts/pdf-viewer-aot/run/artifacts/pdf-viewer/
          if-no-files-found: ignore
